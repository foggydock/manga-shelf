<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16181c">
<title>漫画本棚</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>📚 漫画本棚</h1>
  <div class="header-actions">
    <input id="searchInput" type="text" placeholder="タイトル・作者で検索">
    <button id="fetchCoversBtn" style="display:none">📷 書影をまとめて取り込む</button>
    <button id="addBtn" class="primary" style="display:none">＋ 追加</button>
    <span id="loggedInAs" class="logged-in-as" style="display:none"></span>
    <button id="loginBtn">ログイン</button>
    <button id="logoutBtn" style="display:none">ログアウト</button>
  </div>
</header>

<div id="banner" class="banner" style="display:none"></div>

<main>
  <div id="grid" class="grid"></div>
</main>

<!-- ログインモーダル -->
<div id="loginModal" class="modal" style="display:none">
  <div class="modal-box">
    <h2>ログイン</h2>
    <form id="loginForm">
      <label>メールアドレス<input id="loginEmail" type="email" required></label>
      <label>パスワード<input id="loginPassword" type="password" required></label>
      <div class="modal-actions">
        <button type="button" id="loginCancelBtn">キャンセル</button>
        <button type="submit" class="primary">ログイン</button>
      </div>
    </form>
  </div>
</div>

<!-- 追加・編集モーダル -->
<div id="editModal" class="modal" style="display:none">
  <div class="modal-box">
    <h2 id="editModalTitle">新規登録</h2>
    <form id="editForm">
      <label>タイトル<input id="editTitle" type="text" required></label>
      <label>第1巻のISBN（わかる場合）
        <input id="editIsbn" type="text" inputmode="numeric" autocomplete="off" placeholder="9784091856784">
      </label>
      <button type="button" id="fetchMetadataBtn">✨ 作品情報をまとめて取得</button>
      <p class="metadata-help">ISBNがある場合は、その本の書影を優先します。空欄に情報の候補を入れるため、内容を確認して「保存」を押してください。</p>
      <p id="editMessage" class="edit-message" role="status" aria-live="polite" hidden></p>
      <div id="coverCandidate" class="cover-candidate" hidden>
        <img id="coverCandidateImage" alt="取得した書影の候補">
        <p id="coverCandidateTitle"></p>
        <label class="cover-choice"><input id="useCoverCandidate" type="checkbox">この書影を使う</label>
      </div>
      <label>作者<input id="editAuthor" type="text"></label>
      <label>表紙画像URL<input id="editCoverUrl" type="text" placeholder="https://..."></label>
      <label>ステータス<input id="editStatus" type="text" placeholder="連載中 / 完結 など"></label>
      <label>全巻数（既知の場合）<input id="editTotalVolumes" type="number" min="1"></label>
      <label>所持巻（例: 1-5,7,9-10）<input id="editOwned" type="text"></label>
      <label>既読巻（例: 1-5,7,9-10）<input id="editRead" type="text"></label>
      <label>紹介文・あらすじ
        <textarea id="editSynopsis" rows="4"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" id="deleteBtn" class="danger" style="display:none">削除</button>
        <button type="button" id="editCancelBtn">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/covers.js"></script>
<script src="js/app.js"></script>
</body>
</html>
